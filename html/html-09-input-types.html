<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML-09: HTML5 Input Types</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #2563eb; }
    hr { margin: 1.5rem 0; border: none; border-top: 1px solid #ddd; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.3rem; border: 1px solid #cbd5e1; border-radius: 6px; }
  </style>
</head>
<body>
  <nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to HTML Programs</a>
  </nav>
  <hr>
  <h1>HTML5 Input Types</h1>
  <p><strong>Description:</strong> email, date, number, password and more.</p>
  <hr>

  <form>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="name@example.com">

    <label for="date">Date</label>
    <input type="date" id="date">

    <label for="number">Number (1–100)</label>
    <input type="number" id="number" min="1" max="100" value="50">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <label for="color">Color</label>
    <input type="color" id="color" value="#3b82f6">

    <label for="range">Range</label>
    <input type="range" id="range" min="0" max="100">

    <label for="tel">Telephone</label>
    <input type="tel" id="tel" placeholder="+91 98765 43210">

    <label for="url">URL</label>
    <input type="url" id="url" placeholder="https://example.com">
  </form>
</body>
</html>
