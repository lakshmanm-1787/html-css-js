<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML-13: Media Queries</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 1rem; background: #f1f5f9; }
    nav a { margin-right: 1rem; color: #2563eb; }
    .container { max-width: 900px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    .card { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { color: #1e40af; }
    /* Tablet */
    @media (min-width: 600px) {
      .cards { grid-template-columns: 1fr 1fr; }
      body { background: #e0f2fe; }
    }
    /* Desktop */
    @media (min-width: 900px) {
      .cards { grid-template-columns: 1fr 1fr 1fr; }
      body { background: #f0fdf4; }
      h1::after { content: " (Desktop layout)"; font-size: 0.7em; color: #16a34a; }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="../index.html">Home</a>
      <a href="index.html">Back to HTML Programs</a>
    </nav>
    <h1>Responsive with Media Queries</h1>
    <p>Resize the browser window to see layout and background change.</p>
    <div class="cards">
      <div class="card"><h3>Card 1</h3><p>Mobile: 1 column</p></div>
      <div class="card"><h3>Card 2</h3><p>Tablet (≥600px): 2 columns</p></div>
      <div class="card"><h3>Card 3</h3><p>Desktop (≥900px): 3 columns</p></div>
    </div>
  </div>
</body>
</html>
