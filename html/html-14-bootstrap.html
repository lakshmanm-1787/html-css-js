<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML-14: Bootstrap Components</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Home</a>
      <a class="nav-link text-white" href="index.html">Back to HTML</a>
    </div>
  </nav>
  <div class="container">
    <h1 class="mb-3">Bootstrap Components</h1>
    <p class="text-muted">Using Bootstrap 5 via CDN.</p>

    <div class="alert alert-info">This is a Bootstrap alert component.</div>

    <button class="btn btn-primary me-2">Primary</button>
    <button class="btn btn-success me-2">Success</button>
    <button class="btn btn-outline-danger">Outline Danger</button>

    <div class="card mt-4" style="max-width: 20rem;">
      <div class="card-body">
        <h5 class="card-title">Bootstrap Card</h5>
        <p class="card-text">Simple card component with title and text.</p>
        <a href="#" class="btn btn-sm btn-primary">Go somewhere</a>
      </div>
    </div>

    <div class="mt-4">
      <span class="badge bg-secondary">Badge</span>
      <span class="badge bg-warning text-dark">Warning</span>
    </div>
  </div>
</body>
</html>
