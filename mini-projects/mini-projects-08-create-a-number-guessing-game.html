<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a number guessing game.</title><link rel="stylesheet" href="../assets/style.css"><style>
    .demo{display:grid;gap:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.demo input,.demo select,.demo textarea,.demo button{padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.demo button{cursor:pointer;background:#222;color:#fff}.demo .box{padding:18px;border:1px dashed #888;border-radius:10px}.result{min-height:30px;padding:10px;border-radius:8px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:18px;border:1px solid #ddd;border-radius:12px}</style></head><body><header class="site-header"><a href="../index.html">Practical Lab</a><span>Mini Projects</span></header><main class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">Mini Projects</a></div><h1>Create a number guessing game.</h1><p class="description">Experiment Create a number guessing game.</p><section class="demo"><input id="guess" type="number" value="50"><button onclick="go()">Guess</button><div id="out" class="result"></div></section><p class="note">Use the controls above to test the working demonstration. The source code is contained in this individual experiment file.</p></main><script>const secret=37;function go(){let g=+guess.value;out.textContent=g===secret?'Correct!':g<secret?'Too low':'Too high'}</script></body></html>
