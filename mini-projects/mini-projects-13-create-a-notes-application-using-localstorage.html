<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a notes application using localStorage.</title><link rel="stylesheet" href="../assets/style.css"><style>
    .demo{display:grid;gap:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.demo input,.demo select,.demo textarea,.demo button{padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.demo button{cursor:pointer;background:#222;color:#fff}.demo .box{padding:18px;border:1px dashed #888;border-radius:10px}.result{min-height:30px;padding:10px;border-radius:8px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:18px;border:1px solid #ddd;border-radius:12px}</style></head><body><header class="site-header"><a href="../index.html">Practical Lab</a><span>Mini Projects</span></header><main class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">Mini Projects</a></div><h1>Create a notes application using localStorage.</h1><p class="description">Experiment Create a notes application using localStorage.</p><section class="demo"><input id="v" value="Student"><button onclick="save()">Save</button><button onclick="load()">Load</button><button onclick="clearIt()">Delete</button><div id="out" class="result"></div></section><p class="note">Use the controls above to test the working demonstration. The source code is contained in this individual experiment file.</p></main><script>function save(){localStorage.setItem('labValue',v.value);out.textContent='Saved'}function load(){out.textContent=localStorage.getItem('labValue')||'No value saved'}function clearIt(){localStorage.removeItem('labValue');out.textContent='Deleted'}</script></body></html>
