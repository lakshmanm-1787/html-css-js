<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a BMI calculator.</title><link rel="stylesheet" href="../assets/style.css"><style>
    .demo{display:grid;gap:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.demo input,.demo select,.demo textarea,.demo button{padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.demo button{cursor:pointer;background:#222;color:#fff}.demo .box{padding:18px;border:1px dashed #888;border-radius:10px}.result{min-height:30px;padding:10px;border-radius:8px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:18px;border:1px solid #ddd;border-radius:12px}</style></head><body><header class="site-header"><a href="../index.html">Practical Lab</a><span>Mini Projects</span></header><main class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">Mini Projects</a></div><h1>Create a BMI calculator.</h1><p class="description">Experiment Create a BMI calculator.</p><section class="demo"><input id="w" type="number" value="65" placeholder="kg"><input id="h" type="number" value="1.7" step=".01" placeholder="m"><button onclick="go()">Calculate BMI</button><div id="out" class="result"></div></section><p class="note">Use the controls above to test the working demonstration. The source code is contained in this individual experiment file.</p></main><script>function go(){let bmi=Number(w.value)/(Number(h.value)**2);out.textContent=`BMI=${bmi.toFixed(2)} (${bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese'})`}</script></body></html>
