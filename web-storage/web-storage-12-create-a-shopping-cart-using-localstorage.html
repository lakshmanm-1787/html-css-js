<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a shopping cart using localStorage.</title><link rel="stylesheet" href="../assets/style.css"><style>
    .demo{display:grid;gap:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.demo input,.demo select,.demo textarea,.demo button{padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.demo button{cursor:pointer;background:#222;color:#fff}.demo .box{padding:18px;border:1px dashed #888;border-radius:10px}.result{min-height:30px;padding:10px;border-radius:8px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:18px;border:1px solid #ddd;border-radius:12px}</style></head><body><header class="site-header"><a href="../index.html">Practical Lab</a><span>Web Storage</span></header><main class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">Web Storage</a></div><h1>Create a shopping cart using localStorage.</h1><p class="description">Experiment Create a shopping cart using localStorage.</p><section class="demo"><div class="row"><button onclick="add('Notebook',100)">Add Notebook ₹100</button><button onclick="add('Bag',250)">Add Bag ₹250</button><button onclick="clearCart()">Clear</button></div><div id="out" class="result"></div></section><p class="note">Use the controls above to test the working demonstration. The source code is contained in this individual experiment file.</p></main><script>let cart=JSON.parse(localStorage.getItem('cart')||'[]');function add(name,price){cart.push({name,price});save()}function save(){localStorage.setItem('cart',JSON.stringify(cart));out.textContent=JSON.stringify(cart)}function clearCart(){cart=[];save()}save()</script></body></html>
