<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-17: Calculator</title>
  <style>
    body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #0f172a; color: #f1f5f9; padding: 1.5rem; }
    nav a { color: #10b981; margin-right: 1rem; }
    .calc { background: #1e293b; border-radius: 16px; padding: 1.2rem; width: 280px; margin-top: 1rem; }
    #display { background: #0f172a; color: #34d399; font-size: 1.8rem; text-align: right; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; min-height: 2.5rem; word-break: break-all; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    button { padding: 0.9rem; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; background: #334155; color: white; }
    button:hover { background: #475569; }
    .op { background: #10b981; }
    .eq { background: #3b82f6; grid-column: span 2; }
    .clear { background: #ef4444; }
  </style>
</head>
<body>
  <nav style="align-self:flex-start"><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Digital Calculator</h1>
  <div class="calc">
    <div id="display">0</div>
    <div class="keys">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="append('(')">(</button>
      <button onclick="append(')')">)</button>
      <button class="op" onclick="append('/')">÷</button>
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="op" onclick="append('*')">×</button>
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="op" onclick="append('-')">−</button>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="op" onclick="append('+')">+</button>
      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    let expr = '';
    function append(v) {
      if (expr === '0' && v !== '.') expr = v;
      else expr += v;
      document.getElementById('display').textContent = expr;
    }
    function clearDisplay() {
      expr = '';
      document.getElementById('display').textContent = '0';
    }
    function calculate() {
      try {
        const result = Function('"use strict"; return (' + expr + ')')();
        expr = String(result);
        document.getElementById('display').textContent = expr;
      } catch {
        document.getElementById('display').textContent = 'Error';
        expr = '';
      }
    }
  </script>
</body>
</html>
