<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-08: Palindrome</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    input, button { padding: 0.5rem; margin: 0.3rem; }
    button { background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Palindrome Number</h1>
  <input type="number" id="n" value="121">
  <button onclick="check()">Check</button>
  <p id="out"></p>
  <script>
    function check() {
      const n = document.getElementById('n').value;
      const rev = n.split('').reverse().join('');
      document.getElementById('out').textContent = n === rev ? n + ' is a palindrome' : n + ' is not a palindrome';
    }
  </script>
</body>
</html>
