<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-06: Fibonacci</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    input, button { padding: 0.5rem; margin: 0.3rem; }
    button { background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Fibonacci Series</h1>
  <input type="number" id="n" value="10" min="1">
  <button onclick="fib()">Generate</button>
  <p id="out"></p>
  <script>
    function fib() {
      const n = Number(document.getElementById('n').value);
      let a = 0, b = 1, series = [0];
      for (let i = 1; i < n; i++) {
        series.push(b);
        [a, b] = [b, a + b];
      }
      document.getElementById('out').textContent = series.join(', ');
    }
  </script>
</body>
</html>
