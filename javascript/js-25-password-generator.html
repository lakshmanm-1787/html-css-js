<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-25: Password Generator</title>
  <style>
    body { font-family: system-ui; max-width: 450px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #f1f5f9; min-height: 100vh; }
    nav a { color: #10b981; margin-right: 1rem; }
    #pwd { background: #1e293b; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 1.2rem; word-break: break-all; margin: 1rem 0; min-height: 1.5rem; }
    label { display: block; margin: 0.5rem 0; }
    input[type="number"] { width: 60px; padding: 0.3rem; }
    button { margin-top: 1rem; padding: 0.6rem 1.4rem; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Random Password Generator</h1>
  <label>Length: <input type="number" id="len" value="12" min="4" max="32"></label>
  <label><input type="checkbox" id="upper" checked> Uppercase</label>
  <label><input type="checkbox" id="lower" checked> Lowercase</label>
  <label><input type="checkbox" id="num" checked> Numbers</label>
  <label><input type="checkbox" id="sym" checked> Symbols</label>
  <div id="pwd"></div>
  <button onclick="generate()">Generate</button>
  <script>
    function generate() {
      const len = Number(document.getElementById('len').value);
      let chars = '';
      if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (document.getElementById('num').checked) chars += '0123456789';
      if (document.getElementById('sym').checked) chars += '!@#$%^&*()_+-=[]{}';
      if (!chars) { document.getElementById('pwd').textContent = 'Select at least one option'; return; }
      let pwd = '';
      for (let i = 0; i < len; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
      document.getElementById('pwd').textContent = pwd;
    }
    generate();
  </script>
</body>
</html>
