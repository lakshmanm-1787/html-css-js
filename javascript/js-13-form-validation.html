<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-13: Form Validation</title>
  <style>
    body { font-family: system-ui; max-width: 450px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    label { display: block; margin-top: 0.8rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.3rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    .error { color: #dc2626; font-size: 0.85rem; }
    button { margin-top: 1rem; padding: 0.6rem 1.4rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #success { color: #059669; font-weight: 600; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Form Validation</h1>
  <form id="form" onsubmit="return validate(event)">
    <label>Name</label>
    <input type="text" id="name">
    <div class="error" id="nameErr"></div>
    <label>Email</label>
    <input type="text" id="email">
    <div class="error" id="emailErr"></div>
    <label>Phone</label>
    <input type="text" id="phone">
    <div class="error" id="phoneErr"></div>
    <label>Password</label>
    <input type="password" id="password">
    <div class="error" id="passErr"></div>
    <button type="submit">Submit</button>
  </form>
  <div id="success"></div>
  <script>
    function validate(e) {
      e.preventDefault();
      let ok = true;
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const pass = document.getElementById('password').value;
      document.getElementById('nameErr').textContent = '';
      document.getElementById('emailErr').textContent = '';
      document.getElementById('phoneErr').textContent = '';
      document.getElementById('passErr').textContent = '';
      document.getElementById('success').textContent = '';
      if (!/^[A-Za-z\s]{2,}$/.test(name)) { document.getElementById('nameErr').textContent = 'Enter a valid name (letters only)'; ok = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('emailErr').textContent = 'Enter a valid email'; ok = false; }
      if (!/^\d{10}$/.test(phone)) { document.getElementById('phoneErr').textContent = 'Enter 10-digit phone'; ok = false; }
      if (pass.length < 6) { document.getElementById('passErr').textContent = 'Password must be at least 6 characters'; ok = false; }
      if (ok) document.getElementById('success').textContent = 'Form submitted successfully!';
      return false;
    }
  </script>
</body>
</html>
