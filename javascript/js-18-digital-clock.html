<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-18: Digital Clock</title>
  <style>
    body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #0f172a; color: #f1f5f9; padding: 1.5rem; }
    nav a { color: #10b981; margin-right: 1rem; }
    #clock { font-size: 3.5rem; font-weight: 700; letter-spacing: 0.05em; margin-top: 2rem; color: #34d399; font-variant-numeric: tabular-nums; }
    #date { color: #94a3b8; margin-top: 0.5rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <nav style="align-self:flex-start"><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Digital Clock</h1>
  <div id="clock">00:00:00</div>
  <div id="date"></div>
  <script>
    function update() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-IN', { hour12: false });
      document.getElementById('date').textContent = now.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
