<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-19: Stopwatch</title>
  <style>
    body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #0f172a; color: #f1f5f9; padding: 1.5rem; }
    nav a { color: #10b981; margin-right: 1rem; }
    #time { font-size: 3rem; font-variant-numeric: tabular-nums; margin: 2rem 0; color: #34d399; }
    button { padding: 0.6rem 1.2rem; margin: 0.3rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; color: white; }
    .start { background: #10b981; }
    .stop { background: #ef4444; }
    .reset { background: #64748b; }
  </style>
</head>
<body>
  <nav style="align-self:flex-start"><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Stopwatch</h1>
  <div id="time">00:00:00</div>
  <div>
    <button class="start" onclick="start()">Start</button>
    <button class="stop" onclick="stop()">Stop</button>
    <button class="reset" onclick="reset()">Reset</button>
  </div>
  <script>
    let ms = 0, timer = null;
    function format(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      return [h, m % 60, s % 60].map(v => String(v).padStart(2, '0')).join(':');
    }
    function start() {
      if (timer) return;
      timer = setInterval(() => { ms += 100; document.getElementById('time').textContent = format(ms); }, 100);
    }
    function stop() { clearInterval(timer); timer = null; }
    function reset() { stop(); ms = 0; document.getElementById('time').textContent = '00:00:00'; }
  </script>
</body>
</html>
