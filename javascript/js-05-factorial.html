<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-05: Factorial</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    input, button { padding: 0.5rem; margin: 0.3rem; }
    button { background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Factorial</h1>
  <input type="number" id="n" value="5" min="0">
  <button onclick="fact()">Calculate</button>
  <p id="out"></p>
  <script>
    function fact() {
      let n = Number(document.getElementById('n').value);
      if (n < 0) { document.getElementById('out').textContent = 'Enter non-negative number'; return; }
      let f = 1;
      for (let i = 2; i <= n; i++) f *= i;
      document.getElementById('out').textContent = n + '! = ' + f;
    }
  </script>
</body>
</html>
