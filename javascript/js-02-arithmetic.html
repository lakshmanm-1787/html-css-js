<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-02: Arithmetic</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    input { width: 100px; padding: 0.4rem; margin: 0.3rem; }
    button { padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #result { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Arithmetic Operations</h1>
  <input type="number" id="a" value="10">
  <input type="number" id="b" value="5">
  <br>
  <button onclick="calc()">Calculate</button>
  <div id="result"></div>
  <script>
    function calc() {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      document.getElementById('result').innerHTML =
        `Sum: ${a + b}<br>Diff: ${a - b}<br>Product: ${a * b}<br>Quotient: ${a / b}`;
    }
  </script>
</body>
</html>
