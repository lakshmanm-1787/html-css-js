<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-10: Background Color</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; transition: background 0.3s; }
    nav a { margin-right: 1rem; color: #10b981; }
    button { padding: 0.5rem 1rem; margin: 0.3rem; border: none; border-radius: 6px; cursor: pointer; color: white; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Change Background Color</h1>
  <button style="background:#ef4444" onclick="document.body.style.background='#fecaca'">Red</button>
  <button style="background:#3b82f6" onclick="document.body.style.background='#bfdbfe'">Blue</button>
  <button style="background:#22c55e" onclick="document.body.style.background='#bbf7d0'">Green</button>
  <button style="background:#64748b" onclick="document.body.style.background='#ffffff'">Reset</button>
</body>
</html>
