<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-21: To-Do List</title>
  <style>
    body { font-family: system-ui; max-width: 480px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #f1f5f9; min-height: 100vh; }
    nav a { color: #10b981; margin-right: 1rem; }
    .row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    input { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
    button { padding: 0.6rem 1rem; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #1e293b; padding: 0.8rem 1rem; margin-bottom: 0.5rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    li.done span { text-decoration: line-through; color: #64748b; }
    .del { background: #ef4444; padding: 0.3rem 0.6rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>To-Do List</h1>
  <div class="row">
    <input type="text" id="task" placeholder="Add a task..." onkeydown="if(event.key==='Enter')add()">
    <button onclick="add()">Add</button>
  </div>
  <ul id="list"></ul>
  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    function save() { localStorage.setItem('todos', JSON.stringify(todos)); render(); }
    function render() {
      const list = document.getElementById('list');
      list.innerHTML = todos.map((t, i) =>
        `<li class="${t.done ? 'done' : ''}"><span onclick="toggle(${i})" style="cursor:pointer;flex:1">${t.text}</span><button class="del" onclick="remove(${i})">Delete</button></li>`
      ).join('');
    }
    function add() {
      const input = document.getElementById('task');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      save();
    }
    function toggle(i) { todos[i].done = !todos[i].done; save(); }
    function remove(i) { todos.splice(i, 1); save(); }
    render();
  </script>
</body>
</html>
