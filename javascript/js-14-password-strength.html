<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-14: Password Strength</title>
  <style>
    body { font-family: system-ui; max-width: 450px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    input { width: 100%; padding: 0.6rem; margin: 0.5rem 0; border: 1px solid #cbd5e1; border-radius: 6px; }
    #meter { height: 8px; background: #e2e8f0; border-radius: 4px; margin: 0.5rem 0; overflow: hidden; }
    #bar { height: 100%; width: 0; transition: width 0.3s, background 0.3s; }
    #label { font-weight: 600; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Password Strength Checker</h1>
  <input type="password" id="pwd" placeholder="Enter password" oninput="check()">
  <div id="meter"><div id="bar"></div></div>
  <div id="label"></div>
  <script>
    function check() {
      const p = document.getElementById('pwd').value;
      let score = 0;
      if (p.length >= 8) score++;
      if (/[A-Z]/.test(p)) score++;
      if (/[0-9]/.test(p)) score++;
      if (/[^A-Za-z0-9]/.test(p)) score++;
      const bar = document.getElementById('bar');
      const label = document.getElementById('label');
      const colors = ['#ef4444', '#f59e0b', '#eab308', '#22c55e'];
      const texts = ['Weak', 'Fair', 'Good', 'Strong'];
      bar.style.width = (score * 25) + '%';
      bar.style.background = colors[score - 1] || '#e2e8f0';
      label.textContent = score ? texts[score - 1] : '';
      label.style.color = colors[score - 1] || '';
    }
  </script>
</body>
</html>
