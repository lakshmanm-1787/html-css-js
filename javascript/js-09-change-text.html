<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-09: Change Text</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    button { padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
    #msg { font-size: 1.3rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Change Text with JavaScript</h1>
  <p id="msg">Original text</p>
  <button onclick="document.getElementById('msg').textContent = 'Text changed successfully!'">Change Text</button>
</body>
</html>
