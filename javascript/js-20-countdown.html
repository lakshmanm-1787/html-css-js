<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-20: Countdown</title>
  <style>
    body { font-family: system-ui; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #0f172a; color: #f1f5f9; padding: 1.5rem; }
    nav a { color: #10b981; margin-right: 1rem; }
    input { width: 80px; padding: 0.5rem; margin: 0.5rem; text-align: center; font-size: 1.2rem; }
    #display { font-size: 3rem; margin: 1.5rem 0; color: #f59e0b; font-variant-numeric: tabular-nums; }
    button { padding: 0.6rem 1.2rem; margin: 0.3rem; border: none; border-radius: 8px; cursor: pointer; color: white; background: #10b981; }
  </style>
</head>
<body>
  <nav style="align-self:flex-start"><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Countdown Timer</h1>
  <div>
    <input type="number" id="mins" value="1" min="0"> min
    <input type="number" id="secs" value="0" min="0" max="59"> sec
  </div>
  <div id="display">01:00</div>
  <button onclick="start()">Start</button>
  <button onclick="reset()" style="background:#64748b">Reset</button>
  <script>
    let remaining = 60, timer = null;
    function updateDisplay() {
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      document.getElementById('display').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }
    function start() {
      if (timer) return;
      remaining = Number(document.getElementById('mins').value) * 60 + Number(document.getElementById('secs').value);
      updateDisplay();
      timer = setInterval(() => {
        remaining--;
        updateDisplay();
        if (remaining <= 0) { clearInterval(timer); timer = null; alert('Time\'s up!'); }
      }, 1000);
    }
    function reset() {
      clearInterval(timer); timer = null;
      remaining = Number(document.getElementById('mins').value) * 60 + Number(document.getElementById('secs').value);
      updateDisplay();
    }
  </script>
</body>
</html>
