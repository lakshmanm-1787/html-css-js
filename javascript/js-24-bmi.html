<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-24: BMI Calculator</title>
  <style>
    body { font-family: system-ui; max-width: 420px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #f1f5f9; min-height: 100vh; }
    nav a { color: #10b981; margin-right: 1rem; }
    label { display: block; margin-top: 0.8rem; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.3rem; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
    button { margin-top: 1rem; padding: 0.6rem 1.4rem; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #result { margin-top: 1.2rem; font-size: 1.2rem; font-weight: 600; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>BMI Calculator</h1>
  <label>Weight (kg)</label>
  <input type="number" id="weight" value="70" step="0.1">
  <label>Height (cm)</label>
  <input type="number" id="height" value="170" step="0.1">
  <button onclick="calc()">Calculate BMI</button>
  <div id="result"></div>
  <script>
    function calc() {
      const w = Number(document.getElementById('weight').value);
      const h = Number(document.getElementById('height').value) / 100;
      if (!w || !h) return;
      const bmi = (w / (h * h)).toFixed(1);
      let cat = '';
      if (bmi < 18.5) cat = 'Underweight';
      else if (bmi < 25) cat = 'Normal';
      else if (bmi < 30) cat = 'Overweight';
      else cat = 'Obese';
      document.getElementById('result').textContent = `BMI: ${bmi} (${cat})`;
    }
  </script>
</body>
</html>
