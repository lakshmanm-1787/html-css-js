<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-03: Largest of Three</title>
  <style>
    body { font-family: system-ui; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #10b981; }
    input { width: 80px; padding: 0.4rem; margin: 0.3rem; }
    button { padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Largest of Three Numbers</h1>
  <input type="number" id="x" value="12">
  <input type="number" id="y" value="45">
  <input type="number" id="z" value="23">
  <button onclick="find()">Find Largest</button>
  <p id="out"></p>
  <script>
    function find() {
      const x = Number(document.getElementById('x').value);
      const y = Number(document.getElementById('y').value);
      const z = Number(document.getElementById('z').value);
      const max = Math.max(x, y, z);
      document.getElementById('out').textContent = 'Largest: ' + max;
    }
  </script>
</body>
</html>
