<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-23: Guess Number</title>
  <style>
    body { font-family: system-ui; max-width: 450px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #f1f5f9; min-height: 100vh; text-align: center; }
    nav a { color: #10b981; margin-right: 1rem; }
    input { width: 100px; padding: 0.6rem; font-size: 1.2rem; text-align: center; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
    button { padding: 0.6rem 1.2rem; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 0.5rem; }
    #msg { margin-top: 1rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <nav style="text-align:left"><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Number Guessing Game</h1>
  <p>Guess a number between 1 and 100</p>
  <input type="number" id="guess" min="1" max="100">
  <br>
  <button onclick="check()">Guess</button>
  <button onclick="reset()" style="background:#64748b">New Game</button>
  <div id="msg"></div>
  <script>
    let secret = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    function check() {
      const g = Number(document.getElementById('guess').value);
      attempts++;
      if (g === secret) {
        document.getElementById('msg').textContent = `Correct! You got it in ${attempts} attempts.`;
        document.getElementById('msg').style.color = '#34d399';
      } else if (g < secret) {
        document.getElementById('msg').textContent = 'Too low! Try again.';
        document.getElementById('msg').style.color = '#f59e0b';
      } else {
        document.getElementById('msg').textContent = 'Too high! Try again.';
        document.getElementById('msg').style.color = '#f59e0b';
      }
    }
    function reset() {
      secret = Math.floor(Math.random() * 100) + 1;
      attempts = 0;
      document.getElementById('msg').textContent = '';
      document.getElementById('guess').value = '';
    }
  </script>
</body>
</html>
