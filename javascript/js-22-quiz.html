<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-22: Quiz</title>
  <style>
    body { font-family: system-ui; max-width: 520px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #f1f5f9; min-height: 100vh; }
    nav a { color: #10b981; margin-right: 1rem; }
    .q { background: #1e293b; padding: 1.2rem; border-radius: 12px; margin: 1rem 0; }
    label { display: block; margin: 0.5rem 0; cursor: pointer; }
    button { padding: 0.6rem 1.4rem; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 0.5rem; }
    #score { font-size: 1.3rem; font-weight: 700; color: #34d399; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to JS</a></nav>
  <h1>Simple Quiz</h1>
  <div id="quiz"></div>
  <button onclick="submit()">Submit</button>
  <div id="score"></div>
  <script>
    const questions = [
      { q: 'What does HTML stand for?', options: ['Hyper Text Markup Language', 'High Tech Modern Language', 'Home Tool Markup Language'], answer: 0 },
      { q: 'Which language is used for styling web pages?', options: ['HTML', 'CSS', 'Python'], answer: 1 },
      { q: 'What does JS stand for?', options: ['Java Source', 'JavaScript', 'Just Script'], answer: 1 }
    ];
    const quizEl = document.getElementById('quiz');
    quizEl.innerHTML = questions.map((item, i) => `
      <div class="q">
        <p><strong>${i + 1}. ${item.q}</strong></p>
        ${item.options.map((opt, j) => `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`).join('')}
      </div>
    `).join('');
    function submit() {
      let score = 0;
      questions.forEach((item, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && Number(selected.value) === item.answer) score++;
      });
      document.getElementById('score').textContent = `Score: ${score} / ${questions.length}`;
    }
  </script>
</body>
</html>
