<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete a selected row from an HTML table.</title><link rel="stylesheet" href="../assets/style.css"><style>
    .demo{display:grid;gap:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.demo input,.demo select,.demo textarea,.demo button{padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.demo button{cursor:pointer;background:#222;color:#fff}.demo .box{padding:18px;border:1px dashed #888;border-radius:10px}.result{min-height:30px;padding:10px;border-radius:8px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:18px;border:1px solid #ddd;border-radius:12px}</style></head><body><header class="site-header"><a href="../index.html">Practical Lab</a><span>DOM Manipulation</span></header><main class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">DOM Manipulation</a></div><h1>Delete a selected row from an HTML table.</h1><p class="description">Experiment Delete a selected row from an HTML table.</p><section class="demo"><button onclick="addRow()">Add row</button><table id="tbl"><tr><th>Name</th><th>Mark</th><th>Action</th></tr></table></section><p class="note">Use the controls above to test the working demonstration. The source code is contained in this individual experiment file.</p></main><script>function addRow(){let r=tbl.insertRow();r.innerHTML='<td>Student</td><td>85</td><td><button onclick="this.closest(\'tr\').remove()">Delete</button></td>'}</script></body></html>
