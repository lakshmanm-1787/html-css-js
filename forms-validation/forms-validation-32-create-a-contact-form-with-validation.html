<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a contact form with validation.</title><link rel="stylesheet" href="../assets/style.css"><style>
    .demo{display:grid;gap:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.demo input,.demo select,.demo textarea,.demo button{padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.demo button{cursor:pointer;background:#222;color:#fff}.demo .box{padding:18px;border:1px dashed #888;border-radius:10px}.result{min-height:30px;padding:10px;border-radius:8px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:18px;border:1px solid #ddd;border-radius:12px}</style></head><body><header class="site-header"><a href="../index.html">Practical Lab</a><span>Forms and Validation</span></header><main class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">Forms and Validation</a></div><h1>Create a contact form with validation.</h1><p class="description">Experiment Create a contact form with validation.</p><section class="demo"><form id="f"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><input id="pass" type="password" minlength="8" placeholder="Password" required><button>Submit</button></form><div id="out" class="result"></div></section><p class="note">Use the controls above to test the working demonstration. The source code is contained in this individual experiment file.</p></main><script>f.addEventListener('submit',e=>{e.preventDefault();out.textContent=f.checkValidity()?'Form submitted successfully':'Please correct the form'});[...f.elements].forEach(x=>x.addEventListener('blur',()=>x.reportValidity()))</script></body></html>
