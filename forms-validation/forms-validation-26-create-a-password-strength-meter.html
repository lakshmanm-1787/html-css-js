<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a password strength meter.</title><link rel="stylesheet" href="../assets/style.css"><style>
    .demo{display:grid;gap:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.demo input,.demo select,.demo textarea,.demo button{padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.demo button{cursor:pointer;background:#222;color:#fff}.demo .box{padding:18px;border:1px dashed #888;border-radius:10px}.result{min-height:30px;padding:10px;border-radius:8px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{padding:18px;border:1px solid #ddd;border-radius:12px}</style></head><body><header class="site-header"><a href="../index.html">Practical Lab</a><span>Forms and Validation</span></header><main class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <a href="index.html">Forms and Validation</a></div><h1>Create a password strength meter.</h1><p class="description">Experiment Create a password strength meter.</p><section class="demo"><input id="p" type="password" oninput="go()" placeholder="Password"><meter id="meter" min="0" max="4" value="0"></meter><div id="out" class="result"></div></section><p class="note">Use the controls above to test the working demonstration. The source code is contained in this individual experiment file.</p></main><script>function go(){let s=p.value,n=(s.length>=8)+( /[A-Z]/.test(s))+(/[0-9]/.test(s))+(/[^A-Za-z0-9]/.test(s));meter.value=n;out.textContent=['Very weak','Weak','Medium','Strong','Very strong'][n]}</script></body></html>
