<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-19: Media Queries</title>
  <style>
    body { font-family: system-ui; margin: 0; padding: 1rem; background: #fef3c7; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 1rem; max-width: 900px; margin: 1rem auto; }
    .card { background: white; padding: 1.2rem; border-radius: 10px; }
    @media (min-width: 600px) {
      body { background: #dbeafe; }
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 900px) {
      body { background: #dcfce7; }
      .grid { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Responsive Media Queries</h1>
  <p>Resize window: yellow → blue → green background, 1 → 2 → 3 columns</p>
  <div class="grid">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>
</body>
</html>
