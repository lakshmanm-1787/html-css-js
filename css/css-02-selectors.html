<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-02: Selectors</title>
  <style>
    * { box-sizing: border-box; } /* Universal */
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    p { color: #334155; } /* Element */
    .note { background: #fef9c3; padding: 0.4rem 0.6rem; } /* Class */
    #unique { color: #dc2626; font-weight: 700; } /* ID */
    input[type="text"] { border: 2px solid #8b5cf6; padding: 0.4rem; } /* Attribute */
    h2, h3 { color: #7c3aed; } /* Grouping */
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>CSS Selectors</h1>
  <p>Element selector (all p tags).</p>
  <p class="note">Class selector (.note)</p>
  <p id="unique">ID selector (#unique)</p>
  <input type="text" placeholder="Attribute selector input[type=text]">
  <h2>Grouped h2</h2>
  <h3>Grouped h3</h3>
</body>
</html>
