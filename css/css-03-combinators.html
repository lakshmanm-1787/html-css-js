<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-03: Combinators</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    /* Descendant */
    .box p { color: #059669; }
    /* Child */
    .box > span { background: #dbeafe; padding: 2px 6px; }
    /* Adjacent sibling */
    h3 + p { border-left: 4px solid #f59e0b; padding-left: 0.6rem; }
    /* General sibling */
    h3 ~ p { font-style: italic; }
    .box { border: 1px solid #cbd5e1; padding: 1rem; margin: 1rem 0; border-radius: 8px; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Combinator Selectors</h1>
  <div class="box">
    <span>Direct child span</span>
    <p>Descendant paragraph (green)</p>
    <div><p>Nested descendant also green</p></div>
  </div>
  <h3>Heading</h3>
  <p>Adjacent sibling (orange border + italic via general sibling)</p>
  <p>Another general sibling (italic)</p>
</body>
</html>
