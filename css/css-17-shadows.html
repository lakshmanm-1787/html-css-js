<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-17: Shadows</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background: #f8fafc; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .card {
      background: white; padding: 1.5rem; border-radius: 12px; margin: 1.5rem 0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    }
    .deep { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    h2 { text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Box-shadow & Text-shadow</h1>
  <div class="card">Subtle card shadow</div>
  <div class="card deep">Deeper shadow</div>
  <h2>Text with shadow</h2>
</body>
</html>
