<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-15: Transitions & Transforms</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .box {
      width: 120px; height: 120px; background: #3b82f6; color: white;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; margin: 1rem; cursor: pointer;
      transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    }
    .box:hover { transform: scale(1.15) rotate(5deg); background: #8b5cf6; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .row { display: flex; flex-wrap: wrap; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Transitions & 2D Transforms</h1>
  <p>Hover the boxes:</p>
  <div class="row">
    <div class="box">Hover me</div>
    <div class="box" style="background:#10b981">Scale + Rotate</div>
  </div>
</body>
</html>
