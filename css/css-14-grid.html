<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-14: Grid</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    .cell { background: #10b981; color: white; padding: 1.5rem; border-radius: 10px; text-align: center; font-weight: 600; }
    .span2 { grid-column: span 2; background: #059669; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Responsive CSS Grid</h1>
  <div class="grid">
    <div class="cell">A</div>
    <div class="cell">B</div>
    <div class="cell span2">C (span 2)</div>
    <div class="cell">D</div>
    <div class="cell">E</div>
    <div class="cell">F</div>
  </div>
</body>
</html>
