<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-18: Variables & Dark Mode</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #1e293b;
      --card: #ffffff;
      --accent: #8b5cf6;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --text: #f1f5f9;
      --card: #1e293b;
      --accent: #a78bfa;
    }
    body { font-family: system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem; transition: background 0.3s, color 0.3s; }
    nav a { margin-right: 1rem; color: var(--accent); }
    .card { background: var(--card); padding: 1.5rem; border-radius: 12px; margin: 1rem 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    button { background: var(--accent); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>CSS Variables + Theme Switcher</h1>
  <div class="card">
    <p>This card uses CSS custom properties. Click the button to toggle dark mode.</p>
    <button onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')">Toggle Theme</button>
  </div>
</body>
</html>
