<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-20: SaaS Card</title>
  <style>
    body { font-family: system-ui; background: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; color: #f1f5f9; }
    nav a { color: #a78bfa; margin-right: 1rem; }
    .card {
      background: #1e293b; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 1.75rem; max-width: 340px; width: 100%;
      margin-top: 1.5rem; transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .badge { display: inline-block; background: rgba(139,92,246,0.2); color: #a78bfa; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 999px; font-weight: 600; }
    h2 { margin: 0.8rem 0 0.4rem; font-size: 1.25rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .price { font-size: 2rem; font-weight: 700; margin: 1rem 0; }
    .price span { font-size: 0.9rem; color: #94a3b8; font-weight: 400; }
    button { width: 100%; padding: 0.7rem; background: #8b5cf6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #7c3aed; }
  </style>
</head>
<body>
  <nav style="align-self:flex-start"><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>SaaS Pricing Card</h1>
  <div class="card">
    <span class="badge">Popular</span>
    <h2>Pro Plan</h2>
    <p>Everything you need for a growing team.</p>
    <div class="price">$29 <span>/ month</span></div>
    <button>Get Started</button>
  </div>
</body>
</html>
