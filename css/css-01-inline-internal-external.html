<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-01: Inline, Internal, External</title>
  <style>
    /* Internal CSS */
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .internal { background: #ede9fe; padding: 1rem; border-radius: 8px; color: #5b21b6; }
  </style>
  <!-- External would be: <link rel="stylesheet" href="external.css"> -->
</head>
<body>
  <nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS</a>
  </nav>
  <h1>Inline, Internal & External CSS</h1>
  <p style="color:#dc2626; font-weight:bold;">This paragraph uses <em>inline</em> CSS (style attribute).</p>
  <p class="internal">This paragraph uses <em>internal</em> CSS (defined in &lt;style&gt;).</p>
  <p>External CSS is loaded with: <code>&lt;link rel="stylesheet" href="file.css"&gt;</code></p>
</body>
</html>
