<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-16: Animations</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #e2e8f0;
      border-top-color: #8b5cf6; border-radius: 50%;
      margin: 2rem auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bounce {
      width: 60px; height: 60px; background: #3b82f6; border-radius: 12px;
      margin: 2rem auto;
      animation: bounce 1s ease infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }
  </style>
</head>
<body>
  <nav style="text-align:left"><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Keyframe Animations</h1>
  <p>Loading spinner</p>
  <div class="spinner"></div>
  <p>Bounce</p>
  <div class="bounce"></div>
</body>
</html>
