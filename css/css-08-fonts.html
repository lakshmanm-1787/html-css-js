<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-08: Fonts</title>
  <style>
    body { max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; font-family: system-ui; }
    .serif { font-family: Georgia, serif; font-size: 1.3rem; }
    .sans { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 1.3rem; }
    .mono { font-family: 'Courier New', monospace; font-size: 1.1rem; }
    .bold { font-weight: 700; }
    .italic { font-style: italic; }
    .small-caps { font-variant: small-caps; font-size: 1.2rem; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1 style="font-family:system-ui">Font Properties</h1>
  <p class="serif">Serif font (Georgia)</p>
  <p class="sans">Sans-serif font</p>
  <p class="mono">Monospace font</p>
  <p class="bold">Font-weight: bold</p>
  <p class="italic">Font-style: italic</p>
  <p class="small-caps">Font-variant: small-caps</p>
</body>
</html>
