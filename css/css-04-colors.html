<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-04: Colors</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .swatch { display: inline-block; width: 80px; height: 50px; margin: 0.3rem; border-radius: 6px; text-align: center; line-height: 50px; font-size: 0.75rem; color: white; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>CSS Colors</h1>
  <p style="color: red;">Named color: red</p>
  <p style="color: #2563eb;">Hex: #2563eb</p>
  <p style="color: rgb(220, 38, 38);">RGB: rgb(220, 38, 38)</p>
  <p style="color: hsl(142, 71%, 45%);">HSL: hsl(142, 71%, 45%)</p>
  <p style="background: #1e293b; color: #f8fafc; padding: 0.5rem;">Background + text color</p>
  <div>
    <span class="swatch" style="background:#ef4444;">#ef4444</span>
    <span class="swatch" style="background:#3b82f6;">#3b82f6</span>
    <span class="swatch" style="background:#22c55e;">#22c55e</span>
    <span class="swatch" style="background:#a855f7;">#a855f7</span>
  </div>
</body>
</html>
