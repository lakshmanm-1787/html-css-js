<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-05: Backgrounds</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .demo { height: 120px; border-radius: 10px; margin: 1rem 0; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .color { background-color: #0ea5e9; }
    .image { background-image: url('https://picsum.photos/700/200'); background-size: cover; background-position: center; }
    .repeat { background-image: url('https://picsum.photos/50/50'); background-repeat: repeat; color: #0f172a; text-shadow: 0 0 4px white; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Background Properties</h1>
  <div class="demo color">background-color</div>
  <div class="demo image">background-image + size + position</div>
  <div class="demo repeat">background-repeat</div>
</body>
</html>
