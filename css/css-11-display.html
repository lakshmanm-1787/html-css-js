<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-11: Display</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; color: #7c3aed; }
    .block { display: block; background: #dbeafe; margin: 0.4rem 0; padding: 0.5rem; }
    .inline { display: inline; background: #fef3c7; padding: 0.3rem; }
    .ib { display: inline-block; background: #dcfce7; padding: 0.5rem; margin: 0.2rem; width: 100px; }
    .flex { display: flex; gap: 0.5rem; background: #f3e8ff; padding: 0.5rem; }
    .flex > span { background: #a855f7; color: white; padding: 0.5rem 1rem; border-radius: 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; background: #ecfdf5; padding: 0.5rem; }
    .grid > span { background: #10b981; color: white; padding: 0.8rem; text-align: center; border-radius: 6px; }
    .none { display: none; }
  </style>
</head>
<body>
  <nav><a href="../index.html">Home</a> <a href="index.html">Back to CSS</a></nav>
  <h1>Display Property</h1>
  <div class="block">display: block</div>
  <span class="inline">inline</span> <span class="inline">inline</span>
  <div><span class="ib">inline-block</span><span class="ib">inline-block</span></div>
  <div class="flex"><span>flex</span><span>item</span><span>item</span></div>
  <div class="grid"><span>1</span><span>2</span><span>3</span></div>
  <p>display:none element is hidden: <span class="none">You cannot see me</span></p>
</body>
</html>
